<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luppa — Pulse upitnik</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<style>
:root{
  --bg:#F5F1EE; --ink:#171738;
  --c1:#FFF0EB; --c2:#FADCD2; --c3:#FFB397; --c4:#FF9E7A; --c5:#FF885E; --c6:#FF521B;
  --idle:#E7E7E7; --idle-last:rgba(209,209,208,.5);
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* ---------- header ---------- */
.hero{
  position:fixed; top:env(safe-area-inset-top,0px); left:0; right:0;
  padding-top:47px; text-align:center; z-index:0; pointer-events:none;
  transition:opacity .2s linear, transform .2s linear;
}
.hero img{height:37px}
.hero h1{font-size:28px; line-height:25px; font-weight:400; margin:56px 0 0}
/* ---------- cards ---------- */
.stream{
  position:relative; z-index:1;
  max-width:1020px; margin:0 auto;
  padding:245px 16px 220px;
}
.card{
  background:#fff; border:1px solid rgba(0,0,0,.16); border-radius:24px;
  padding:56px 40px 64px; margin-bottom:12px;
  min-height:324px;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  transition:min-height .42s var(--ease-out);
}
.card.answered{min-height:400px}
.q{
  font-size:23px; line-height:30px; letter-spacing:-.23px;
  text-align:center; max-width:648px; margin:0 0 44px;
}
.answer-line{
  height:20px; margin:-24px 0 20px;
  font-size:13.7px; letter-spacing:-.68px; text-align:center;
  opacity:0; transform:translateY(4px);
  transition:opacity .26s var(--ease-out), transform .26s var(--ease-out);
}
.card.answered .answer-line{opacity:1; transform:none}
/* scale row */
.scale-row{display:flex; align-items:center; gap:14px; width:100%; justify-content:center}
.edge{font-size:12px; white-space:nowrap; width:92px}
.edge.right{text-align:left}
.edge.left{text-align:right}
.scale{display:flex; gap:1px; touch-action:pan-y; user-select:none; -webkit-user-select:none}
.scale.dragging .seg{cursor:grabbing}
.seg{
  width:105px; height:20px; background:var(--idle);
  cursor:pointer; position:relative;
  transition:background .15s ease, transform .14s var(--ease-out);
}
.seg:last-child{background:var(--idle-last)}
.seg:first-child{border-radius:305px 0 0 305px}
.seg:last-child{border-radius:0 305px 305px 0}
.seg:active{transform:scaleY(.85)}
.seg .tip{
  position:absolute; top:26px; left:50%; transform:translateX(-50%);
  font-size:12px; letter-spacing:-.6px; white-space:nowrap;
  opacity:0; transition:opacity .15s ease; pointer-events:none;
}
.scale:hover .seg.hovered .tip{opacity:1}
/* comment */
.comment{
  width:100%; max-width:648px; margin-top:40px;
  opacity:0; transform:translateY(6px) scale(.97); visibility:hidden;
  transition:opacity .26s var(--ease-out) .08s, transform .26s var(--ease-out) .08s, visibility 0s .34s;
}
.card.answered .comment{opacity:1; transform:none; visibility:visible; transition:opacity .26s var(--ease-out) .08s, transform .26s var(--ease-out) .08s}
.comment textarea{
  width:100%; min-height:64px; resize:vertical;
  border:1px solid rgba(0,0,0,.16); border-radius:12px;
  padding:12px 14px; font:400 14px/1.5 'Inter',sans-serif; color:var(--ink);
  background:#fff; outline:none;
}
.comment textarea:focus{border-color:var(--c6)}
/* ---------- bottom veil + progress ---------- */
.veil{
  position:fixed; left:0; right:0; bottom:0; height:168px; z-index:2;
  background:linear-gradient(to top, var(--bg) 13.4%, rgba(245,241,238,0) 100%);
  pointer-events:none; transition:opacity .3s linear;
}
.dock{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(37px + env(safe-area-inset-bottom,0px)); z-index:3;
}
.pill{
  width:589px; max-width:calc(100vw - 32px); height:29px;
  background:#fff; border-top:1px solid rgba(0,0,0,.04); border-radius:15px;
  box-shadow:0 2px 1px rgba(0,0,0,.09);
  position:relative;
  transition:transform .18s var(--ease-out), opacity .18s var(--ease-out);
}
.pill .track{
  position:absolute; left:12px; right:17px; top:11px; height:6px;
  border-radius:2px; background:rgba(216,216,216,.5); overflow:hidden;
}
.pill .fill{
  position:absolute; inset:0;
  background:linear-gradient(90deg,#FFC8B4,#FF521B);
  transform-origin:left; transform:scaleX(var(--p,0));
  transition:transform .42s var(--ease-out);
}
.bubble{
  position:absolute; bottom:30px;
  left:calc(12px + var(--track-w,560px) * var(--p,0));
  transform:translateX(-50%);
  background:#fff; border-radius:72px; padding:0 12px; height:22px; line-height:22px;
  font-size:14px; letter-spacing:.02em; text-transform:uppercase; color:rgba(23,23,56,.8);
  white-space:nowrap;
  transition:left .42s var(--ease-out);
}
.bubble::after{
  content:''; position:absolute; left:50%; bottom:-2.5px; transform:translateX(-50%);
  border:2.6px solid transparent; border-top:4.5px solid #fff; border-bottom:none;
}
.next{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transform:translateY(16px) scale(.97);
  transition:opacity .26s var(--ease-drawer) .06s, transform .26s var(--ease-drawer) .06s;
}
.dock.done .pill{opacity:0; transform:translateY(12px)}
.dock.done .next{opacity:1; pointer-events:auto; transform:none}
.next button{
  height:44px; padding:0 36px; border:none; border-radius:24px; cursor:pointer;
  color:#fff; font:600 15px 'Inter',sans-serif;
  background:linear-gradient(180deg,#21214D,#171738);
  box-shadow:0 8px 20px rgba(23,23,56,.25);
  transition:transform .14s var(--ease-out);
}
.next button:active{transform:scale(.96)}
/* final card */
.final{
  display:none; text-align:center; padding:80px 40px;
}
.final h2{font-weight:500; font-size:23px; margin:0}

/* ===== progress celog upitnika: 3 strane, diskretni delovi ===== */
.pill .track{background:none; overflow:visible}
.pill .knob{
  position:absolute; top:8px; left:0; width:12px; height:12px;
  background:#fff; border:3px solid #FF521B; border-radius:50%; z-index:3;
  transition:left .42s var(--ease-out);
}
.bubble{z-index:4}
.pt-base{position:absolute; inset:0; border-radius:2px; background:rgba(216,216,216,.5)}
.pt-fill{
  position:absolute; left:0; top:0; bottom:0; border-radius:2px;
  background-image:linear-gradient(90deg,#FFC8B4,#FF521B);
  transition:width .42s var(--ease-out);
}
/* v1: diskretni delovi */
.pt-seg{position:absolute; top:0; height:100%; border-radius:3px; background:rgba(216,216,216,.5); overflow:hidden}
.pt-seg .pt-fill{border-radius:0}
/* oznaka strane iznad kartica */
.page-label{text-align:center; font-size:13px; letter-spacing:.02em; text-transform:uppercase; opacity:.55; margin:0 0 14px}
/* "Strana X od Y": u toku stranice nestaje cim se krene skrolovati, a kad logo i naslov izadju iz vidnog polja vraca se zakacena gore */
.page-pin{
  position:fixed; top:calc(12px + env(safe-area-inset-top,0px)); left:50%; z-index:3; pointer-events:none;
  transform:translate(-50%,-6px); opacity:0;
  background:#fff; border-radius:72px; padding:0 12px; height:24px; line-height:24px;
  font-size:12px; letter-spacing:.02em; text-transform:uppercase; color:rgba(23,23,56,.8); white-space:nowrap;
  box-shadow:0 2px 1px rgba(0,0,0,.09);
  transition:opacity .25s var(--ease-out), transform .25s var(--ease-out);
}
.page-pin.on{opacity:1; transform:translate(-50%,0)}

/* touch: nema hover tooltipa — odgovor vec pise iznad skale */
@media (hover:none){ .seg .tip{display:none !important} }
/* ---------- mobile (po Figma sekciji Screens — Mobile, 2670:2) ---------- */
@media (max-width: 640px){
  .hero{padding-top:32px}
  .hero img{height:27px}
  .hero h1{font-size:20px; line-height:25px; margin:36px 16px 0}
  .stream{padding:150px 8px 200px}
  .card{padding:19px 16px; border-radius:20px; min-height:0; margin-bottom:12px}
  .card.answered{min-height:0}
  .q{font-size:16px; line-height:22px; letter-spacing:-.16px; margin-bottom:20px; font-weight:500; text-align:left; width:100%}
  .answer-line{font-size:15px; font-weight:700; line-height:14px; letter-spacing:-.4px; margin:-8px 0 16px; height:auto}
  /* skala: segmenti FILL 36px, gap 2, labele Medium 14 (Figma 2670:42) */
  .scale-row{flex-wrap:wrap; gap:10px 0}
  .scale{order:1; flex:1 0 100%; gap:2px}
  .seg{flex:1 1 0; width:auto; height:36px}
  .seg .tip{display:none}
  .edge{width:auto; font-size:14px; font-weight:500; padding-top:3px}
  .edge.left{opacity:.74}
  .edge.right{opacity:.7}
  .edge.left{order:2; margin-right:auto; text-align:left}
  .edge.right{order:3; margin-left:auto; text-align:left}
  .comment{display:none !important}
  .pill{height:36px; border-radius:18px}
  .pill .track{left:16px; right:16px; top:13px; height:10px}
  .pill .track, .pt-seg{border-radius:5px}
  .pill .knob{top:10px; width:16px; height:16px; border-width:3px}
  .bubble{bottom:37px; height:26px; line-height:26px; padding:0 14px}
  .dock{bottom:calc(28px + env(safe-area-inset-bottom,0px)); width:calc(100vw - 32px)}
  .next button{width:100%; max-width:326px}
  .final{padding:56px 20px}
  .final h2{font-size:18px}
}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important}
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){/* prototype stays light by design */}
}
</style>
</head>

<script>
$(function(){
  /* Figma Stetoskop_forma 2693:1363 — #DCDCFB + #171738 na 0/10/30/50/70/100% */
  var COLORS = ['#DCDCFB','#C8C8E8','#A1A1C1','#7A7A9A','#525273','#171738'];
  var LABELS = [
    'U potpunosti se ne slažem','Uglavnom se ne slažem','Delimično se ne slažem',
    'Delimično se slažem','Uglavnom se slažem','U potpunosti se slažem'
  ];
  var QUESTIONS = [
    'Zadovoljan/na sam uslovima rada (platom, finansijskim i nefinansijskim benefitima i opremom za rad).',
    'Imam dovoljno slobode u načinu na koji obavljam svoj posao.',
    'Moj menadžer mi daje korisne povratne informacije o mom radu.',
    'Komunikacija unutar mog tima je otvorena i pravovremena.',
    'Vidim mogućnost za lični i profesionalni razvoj u ovoj kompaniji.',
    'Imam jasna očekivanja u vezi sa svojim radnim zadacima.',
    'Moj rad je prepoznat i cenjen.',
    'Imam resurse i alate potrebne da kvalitetno obavim posao.',
    'Opterećenje poslom mi je uglavnom podnošljivo.',
    'Mogu da uskladim poslovne i privatne obaveze.',
    'Verujem odlukama rukovodstva kompanije.',
    'Razumem kako moj rad doprinosi ciljevima kompanije.',
    'Osećam se slobodno da iznesem svoje mišljenje i ideje.',
    'Ponosan/na sam što radim u ovoj kompaniji.',
    'Preporučio/la bih ovu kompaniju kao dobro mesto za rad.',
    'Članovi mog tima pomažu jedni drugima kada je to potrebno.',
    'Saradnja sa drugim timovima u kompaniji je efikasna.',
    'U mom timu se konflikti rešavaju otvoreno i konstruktivno.',
    'Osećam da pripadam svom timu.',
    'Moj tim ima jasne zajedničke ciljeve.',
    'Moj menadžer je dostupan kada mi je potrebna podrška.',
    'Moj menadžer se fer odnosi prema svim članovima tima.',
    'Moj menadžer me podstiče da preuzmem inicijativu.',
    'Sa svojim menadžerom redovno razgovaram o svom razvoju.',
    'Imam poverenja u svog neposrednog menadžera.',
    'Imam priliku da učim nove veštine na poslu.',
    'Kompanija ulaže u moju edukaciju i usavršavanje.',
    'Jasno mi je kako mogu da napredujem u karijeri ovde.',
    'Moj posao mi pruža dovoljno izazova.',
    'Dobijam priliku da radim na zanimljivim projektima.',
    'Kompanija brine o zdravlju i dobrobiti zaposlenih.',
    'Retko osećam stres koji utiče na moj privatni život.',
    'Imam dovoljno vremena za odmor i oporavak.',
    'Moje radno okruženje je prijatno i bezbedno.',
    'Fleksibilnost u radnom vremenu mi odgovara.',
    'Pravovremeno dobijam informacije važne za moj posao.',
    'Rukovodstvo otvoreno komunicira o planovima kompanije.',
    'Razumem strategiju i pravac razvoja kompanije.',
    'Znam kome da se obratim kada imam problem.',
    'Moje povratne informacije se uzimaju u obzir.',
    'Vrednosti kompanije se vide u svakodnevnom radu.',
    'U kompaniji se poštuju različitosti.',
    'Greške se tretiraju kao prilika za učenje.',
    'Uspesi se u kompaniji zajednički slave.',
    'Kompanija se ponaša odgovorno prema zajednici i okruženju.',
    'Radujem se odlasku na posao većinu dana.',
    'Spreman/na sam da uložim dodatni trud kada je potrebno.',
    'Vidim sebe u ovoj kompaniji i za dve godine.',
    'Moj posao mi daje osećaj smisla.',
    'Sveukupno, zadovoljan/na sam svojim poslom.'
  ];
  var PER = 5, PAGES = 10, page = 0;

  var $stream = $('#stream');
  function renderPage(){
    var lbl = 'Strana '+(page+1)+' od '+PAGES;
    $stream.empty().append('<div class="page-label">'+lbl+'</div>');
    $('#pagePin').text(lbl);
    QUESTIONS.slice(page*PER, page*PER+PER).forEach(function(q,j){ appendCard(q, page*PER+j); });
    $stream.append('<section class="card final" id="finalCard"><h2>Hvala! Upitnik je završen 🎉</h2></section>');
    $('.card').not('.final').each(function(i){
      var el = this;
      setTimeout(function(){
        $(el).css({transition:'opacity .3s var(--ease-out), transform .3s var(--ease-out), min-height .42s var(--ease-out)', opacity:1, transform:'none'});
      }, 60 + i*50);
    });
    $('#nextBtn').text(page < PAGES-1 ? 'Next page' : 'Finish');
    onScroll();
  }
  function appendCard(q,i){
    var segs = COLORS.map(function(_,k){
      return '<div class="seg" data-v="'+k+'"><span class="tip">'+LABELS[k]+'</span></div>';
    }).join('');
    $stream.append(
      '<section class="card" data-i="'+i+'" style="opacity:0;transform:translateY(14px)">'+
        '<p class="q">'+q+'</p>'+
        '<div class="answer-line"></div>'+
        '<div class="scale-row">'+
          '<span class="edge left">Ne slažem se</span>'+
          '<div class="scale">'+segs+'</div>'+
          '<span class="edge right">Slažem se</span>'+
        '</div>'+
        '<div class="comment"><textarea placeholder="Komentar (opciono)…"></textarea></div>'+
      '</section>'
    );
    if(answers[i] !== undefined){
      var $c = $stream.children().last();
      paint($c.find('.scale'), answers[i]);
      $c.addClass('answered').find('.answer-line').text('Odgovor: '+LABELS[answers[i]]);
    }
  }

  var answers = {};

  function paint($scale, upTo, stagger){ // upTo: -1 clears; stagger: kockice se pale redom
    $scale.find('.seg').each(function(k){
      var bg = k <= upTo ? COLORS[k] : (k===5 ? 'var(--idle-last)' : 'var(--idle)');
      $(this).css({'transition-delay': stagger && k <= upTo ? (k*35)+'ms' : '0ms', background: bg});
    });
  }

  // hover
  $stream.on('mouseenter','.seg',function(){
    var $s = $(this), $scale = $s.closest('.scale'), i = +$s.closest('.card').data('i');
    $scale.find('.seg').removeClass('hovered');
    $s.addClass('hovered');
    paint($scale, +$s.data('v'));
  });
  $stream.on('mouseleave','.scale',function(){
    var $scale = $(this), i = +$scale.closest('.card').data('i');
    $scale.find('.seg').removeClass('hovered');
    paint($scale, answers[i] !== undefined ? answers[i] : -1);
  });

  // klik + prevlacenje (swipe) preko kockica, kao na Swiperu
  function choose($card, v, stagger){
    var i = +$card.data('i'), isNew = answers[i] === undefined;
    if(answers[i] === v) return;
    answers[i] = v;
    paint($card.find('.scale'), v, stagger);
    $card.find('.seg').removeClass('hovered');
    $card.addClass('answered').find('.answer-line').text('Odgovor: '+LABELS[v]);
    if(isNew) updateProgress(true);
  }
  var drag = null;
  $stream.on('pointerdown','.seg',function(e){
    if(e.pointerType==='mouse' && e.button!==0) return;
    var $card = $(this).closest('.card');
    drag = {$card:$card, $scale:$card.find('.scale'), moved:false};
    drag.$scale.addClass('dragging');
    choose($card, +$(this).data('v'), true);
  });
  $(document).on('pointermove',function(e){
    if(!drag) return;
    var el = document.elementFromPoint(e.clientX, e.clientY), $seg = $(el).closest('.seg');
    if(!$seg.length || !$.contains(drag.$scale[0], $seg[0])) return;
    drag.moved = true;
    choose(drag.$card, +$seg.data('v'), false);
  });
  $(document).on('pointerup pointercancel',function(){
    if(!drag) return;
    drag.$scale.removeClass('dragging');
    drag = null;
  });

  // ---------- progress ----------
  var total = QUESTIONS.length, msgTimer, bubbleText = '0%';
  function count(){ return Object.keys(answers).length; }
  function pageCount(k){
    var c = 0;
    for(var i=k*PER;i<k*PER+PER;i++) if(answers[i] !== undefined) c++;
    return c;
  }
  function pct(n){ return Math.round(n/total*100)+'%'; }
  function setBubble(text){ bubbleText = text; $('#bubble').text(text); }

  // progress celog upitnika: po jedan deo trake za svaku stranu
  var $pill = $('#pill'), bar = {};
  function buildBar(){
    $pill.empty();
    bar = {track:$('<div class="track">').appendTo($pill), segs:[]};
    for(var k=0;k<PAGES;k++){
      var $s = $('<div class="pt-seg">').appendTo(bar.track);
      bar.segs.push({$s:$s, $f:$('<div class="pt-fill">').appendTo($s)});
    }
    bar.knob = $('<div class="knob" id="knob">').appendTo($pill);
    bar.bubble = $('<div class="bubble" id="bubble">').text(bubbleText).appendTo($pill);
  }
  function renderBar(){
    var t = bar.track[0], W = t.clientWidth, tl = t.offsetLeft;
    var gap = 4, w = (W - gap*(PAGES-1))/PAGES;
    bar.segs.forEach(function(sg,k){
      var left = k*(w+gap);
      sg.$s.css({left:left+'px', width:w+'px'});
      sg.$f.css({width:(pageCount(k)/PER*100)+'%', backgroundSize:W+'px 100%', backgroundPosition:(-left)+'px 0'});
    });
    var x = page*(w+gap) + pageCount(page)/PER*w;
    bar.knob.css('left', (tl + x - bar.knob.outerWidth()/2)+'px');
    bar.bubble.css('left', (tl + x)+'px');
  }
  $(window).on('resize', function(){ renderBar(); });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ renderBar(); });

  function updateProgress(announce){
    var n = count();
    renderBar();
    setBubble(pct(n));
    var msg = !announce ? null : n === total ? 'All done 🎉' : n % PER === 0 ? 'Strana '+(n/PER)+'/'+PAGES+' gotova ✓' : n === 2 ? 'Great start!' : null;
    if(msg){
      clearTimeout(msgTimer);
      setBubble(msg);
      msgTimer = setTimeout(function(){ setBubble(pct(count())); }, 2200);
    }
  }
  buildBar();
  renderPage();
  updateProgress(false);

  // idle poruke
  setInterval(function(){
    if(count()<total){
      setBubble('Your answers are anonymous');
      setTimeout(function(){ setBubble(pct(count())); }, 2600);
    }
  }, 12000);

  // ---------- scroll: header fade + dock swap ----------
  function onScroll(){
    var y = $(window).scrollTop();
    var t = Math.min(1, y/160);
    $('#hero').css({opacity: 1 - t*0.88, transform:'translateY('+(-t*14)+'px)'});

    var doc = document.documentElement;
    var atEnd = y + window.innerHeight >= doc.scrollHeight - 40;
    $('#dock').toggleClass('done', atEnd);
    $('#veil').css('opacity', atEnd ? 0 : 1);

    // "Strana X od Y": u flow-u nestaje cim se krene skrolovati; zakacena se vraca kad logo i naslov izadju iz vidnog polja
    $('.page-label').css('opacity', .55 * (1 - Math.min(1, y/50)));
    var $lbl = $('.page-label');
    if($lbl.length){
      var firstCardTop = $lbl.offset().top + $lbl.outerHeight(true),
          heroTop = parseFloat($('#hero').css('padding-top')) || 0;
      $('#pagePin').toggleClass('on', y > firstCardTop - heroTop);
    }
  }
  $(window).on('scroll resize', onScroll); onScroll();

  // Next page
  $('#nextBtn').on('click', function(){
    if(pageCount(page) < PER){
      var missing = $('.card').not('.final').filter(function(){ return answers[$(this).data('i')] === undefined; }).first();
      $('html,body').animate({scrollTop: missing.offset().top - 80}, 420);
      clearTimeout(msgTimer);
      setBubble('Answer all questions first');
      msgTimer = setTimeout(function(){ setBubble(pct(count())); }, 2200);
    } else if(page < PAGES-1){
      page++;
      renderPage();
      window.scrollTo(0,0);
      renderBar();
    } else {
      $('#finalCard').show();
      $('html,body').animate({scrollTop: $('#finalCard').offset().top - 120}, 420);
    }
  });
});
</script>
</body>
</html>
